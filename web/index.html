    <script>
      // Language before the first paint, so the page never flashes the wrong one (src/i18n.js):
      // a link's ?lang= (this visit only), the saved choice, else English. The browser's language is not
      // asked: the page is in English, and Spanish is there for whoever picks it.
      (function () {
        var langs = ['en', 'es'];
        var saved = null;
        try { saved = localStorage.getItem('tridi-lang'); } catch (e) {}
        var asked = new URLSearchParams(location.search).get('lang');
        var lang = [asked, saved, 'en'].find(function (l) { return langs.indexOf(l) >= 0; });
        document.documentElement.dataset.lang = lang;
        document.documentElement.lang = lang;
      })();
    </script>
